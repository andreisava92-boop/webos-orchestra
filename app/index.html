<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self' file:; connect-src http://127.0.0.1:8099; img-src 'self' data:">
<title>Orchestra</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #05080f;
    --card: rgba(19, 27, 46, .78);
    --line: rgba(255, 255, 255, .12);
    --text: #eef4ff;
    --muted: #93a4c3;
    --accent: #7dd3fc;
    --accent-2: #a78bfa;
    --ok: #6ee7b7;
    --warn: #fbbf24;
    --err: #fca5a5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(1200px 700px at 12% 0%, rgba(56, 189, 248, .20), transparent 62%),
      radial-gradient(1000px 700px at 100% 100%, rgba(167, 139, 250, .18), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .screen {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    padding: 64px 80px 44px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 40px;
  }
  .eyebrow {
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  h1 {
    margin: 10px 0 8px;
    font-size: 92px;
    line-height: .95;
    letter-spacing: -.04em;
  }
  .sub { margin: 0; color: var(--muted); font-size: 26px; }
  .status {
    flex: 0 0 auto;
    padding: 12px 22px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .05);
    color: var(--muted);
    font-size: 22px;
    line-height: 1.2;
  }
  .status.ok { color: var(--ok); border-color: rgba(110, 231, 183, .35); background: rgba(110, 231, 183, .09); }
  .status.pending { color: var(--warn); border-color: rgba(251, 191, 36, .35); background: rgba(251, 191, 36, .09); }
  .status.err { color: var(--err); border-color: rgba(252, 165, 165, .35); background: rgba(252, 165, 165, .09); }

  .banner {
    margin: 26px 0 0;
    padding: 16px 22px;
    border: 1px solid rgba(252, 165, 165, .35);
    border-radius: 16px;
    background: rgba(252, 165, 165, .08);
    color: var(--err);
    font-size: 21px;
    line-height: 1.4;
  }
  .banner.info {
    border-color: rgba(125, 211, 252, .35);
    background: rgba(125, 211, 252, .09);
    color: var(--accent);
  }

  main { display: flex; flex-direction: column; gap: 40px; margin-top: 34px; }
  .cards { display: flex; gap: 30px; }
  .card {
    position: relative;
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    min-height: 286px;
    padding: 34px 34px 30px;
    border: 2px solid var(--line);
    border-radius: 30px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 26px 60px rgba(0, 0, 0, .35);
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .card .icon {
    display: grid;
    place-items: center;
    width: 92px;
    height: 92px;
    margin-bottom: 8px;
    border-radius: 24px;
    color: var(--accent);
    background: rgba(125, 211, 252, .12);
  }
  .card .icon svg { width: 58px; height: 58px; }
  .card .title { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .card .hint { color: var(--muted); font-size: 21px; line-height: 1.3; }
  .card .check {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 30px;
    height: 30px;
    border: 3px solid rgba(255, 255, 255, .22);
    border-radius: 50%;
  }
  .card.active { border-color: rgba(125, 211, 252, .55); background: linear-gradient(180deg, rgba(125, 211, 252, .17), rgba(125, 211, 252, .05)); }
  .card.active .check {
    border-color: var(--accent);
    background: radial-gradient(circle, var(--accent) 0 46%, transparent 48%);
  }
  .card.focused {
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(125, 211, 252, .22), rgba(125, 211, 252, .07));
    transform: translateY(-6px);
    box-shadow: 0 34px 70px rgba(56, 189, 248, .22);
  }
  .card.focused .icon { background: rgba(125, 211, 252, .26); }
  .card:disabled { opacity: .55; cursor: wait; }

  .avsync {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    padding: 24px 34px;
    border: 2px solid var(--line);
    border-radius: 26px;
    background: rgba(255, 255, 255, .04);
  }
  .avsync-label { display: flex; flex-direction: column; gap: 4px; }
  .kicker {
    color: var(--accent);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .name { font-size: 28px; font-weight: 650; }
  .avsync-control { display: flex; align-items: center; gap: 18px; }

  .digital {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    padding: 20px 34px;
    border: 2px solid var(--line);
    border-radius: 26px;
    background: rgba(255, 255, 255, .04);
  }
  .digital-label { display: flex; flex-direction: column; gap: 4px; }
  .digital .hint { color: var(--muted); font-size: 18px; }
  .seg { display: flex; gap: 14px; }
  .seg-option {
    padding: 14px 28px;
    border: 2px solid var(--line);
    border-radius: 18px;
    background: rgba(255, 255, 255, .05);
    color: var(--text);
    font: inherit;
    font-size: 23px;
    font-weight: 650;
    cursor: pointer;
  }
  .seg-option.active { border-color: rgba(125, 211, 252, .55); background: rgba(125, 211, 252, .16); }
  .seg-option.focused { border-color: var(--accent); background: rgba(125, 211, 252, .28); }
  .seg-option:disabled { opacity: .55; cursor: wait; }

  .step {
    width: 78px;
    height: 78px;
    border: 2px solid var(--line);
    border-radius: 20px;
    background: rgba(255, 255, 255, .06);
    color: var(--text);
    font: inherit;
    font-size: 42px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
  }
  .step.focused { border-color: var(--accent); background: rgba(125, 211, 252, .2); }
  .av-value {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    min-width: 150px;
    font-variant-numeric: tabular-nums;
  }
  .av-value b { font-size: 54px; font-weight: 800; letter-spacing: -.04em; }
  .av-value small { color: var(--muted); font-size: 20px; font-weight: 600; }

  footer {
    display: flex;
    gap: 34px;
    color: var(--muted);
    font-size: 20px;
  }
  footer b {
    display: inline-block;
    margin-right: 8px;
    padding: 3px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, .06);
    color: var(--text);
    font-size: 17px;
  }
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="brand">
      <div class="eyebrow">LG OLED · TV + soundbar</div>
      <h1>Orchestra</h1>
      <p class="sub">Choose which speakers play.</p>
    </div>
    <div class="status" id="status" aria-live="polite">Connecting…</div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <section class="cards" id="cards" aria-label="Speakers">
      <button class="card" type="button" data-value="tv_speaker">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2.2"/><path d="M8 20.5h8M12 17v3.5"/></svg>
        </span>
        <span class="title">TV only</span>
        <span class="hint">The TV speakers</span>
        <span class="check" aria-hidden="true"></span>
      </button>

      <button class="card" type="button" data-value="external_arc">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="6" height="18" rx="2"/><circle cx="7.5" cy="7.5" r="1.2"/><circle cx="7.5" cy="12" r="1.2"/><path d="M14.5 6.5c1.7 1.3 1.7 4.2 0 5.5M17.5 4.5c3 2.3 3 7.2 0 9.5"/></svg>
        </span>
        <span class="title">Soundbar only</span>
        <span class="hint">Philips TAB8905 · HDMI ARC</span>
        <span class="check" aria-hidden="true"></span>
      </button>

      <button class="card" type="button" data-value="tv_speaker_optical_arc">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="4" width="12" height="9.5" rx="2"/><path d="M5.5 17h4"/><rect x="15.5" y="8" width="5" height="12" rx="1.6"/><circle cx="18" cy="11.5" r="1.1"/><path d="M13.8 10.5h1.7"/></svg>
        </span>
        <span class="title">TV + soundbar</span>
        <span class="hint">Both at once · PCM only</span>
        <span class="check" aria-hidden="true"></span>
      </button>
    </section>

    <section class="digital" aria-label="Digital audio">
      <div class="digital-label">
        <span class="kicker">Digital audio</span>
        <span class="name">HDMI ARC format</span>
        <span class="hint">Pass Through sends Dolby/DTS (soundbar only)</span>
      </div>
      <div class="seg" id="digital-options" role="radiogroup" aria-label="Digital audio">
        <button class="seg-option" type="button" data-value="auto">Auto</button>
        <button class="seg-option" type="button" data-value="pcm">PCM</button>
        <button class="seg-option" type="button" data-value="passThrough">Pass Through</button>
      </div>
    </section>

    <section class="avsync" aria-label="AV sync">
      <div class="avsync-label">
        <span class="kicker">Sync</span>
        <span class="name">TV delay vs soundbar</span>
      </div>
      <div class="avsync-control">
        <button class="step" type="button" id="minus" aria-label="Decrease 5 ms">−</button>
        <span class="av-value"><b id="avvalue">—</b><small>ms</small></span>
        <button class="step" type="button" id="plus" aria-label="Increase 5 ms">+</button>
      </div>
    </section>
  </main>

  <footer>
    <span><b>← →</b> navigate</span>
    <span><b>OK</b> apply</span>
    <span><b>Back</b> exit</span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
